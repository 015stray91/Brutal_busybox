- name: Setup Android NDK
  uses: nttld/setup-ndk@v1.5.0steps:
  - uses: actions/checkout@v3
  - uses: nttld/setup-ndk@v1
    with:
      ndk-version: r26d
  - run: ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mksteps:
  - uses: actions/checkout@v3
  - uses: nttld/setup-ndk@v1
    id: setup-ndk
    with:
      ndk-version: r21e
      add-to-path: false
  - run: ./build.sh
    env:
      ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}steps:
  - uses: actions/checkout@v3
  - uses: nttld/setup-ndk@v1
    id: setup-ndk
    with:
      ndk-version: r26d
      link-to-sdk: true
  - run: ./gradlew buildsteps:
  - uses: actions/checkout@v3
  - uses: nttld/setup-ndk@v1
    with:
      ndk-version: r21e
      local-cache: true
