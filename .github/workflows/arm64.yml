name: Build Brutal Busybox Static Binary

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-aarch64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make bzip2 xz-utils git bc unzip wget

      - name: Download Official Android NDK r30 from Google
        run: |
          echo "📥 Downloading official NDK r30 directly from Google..."
          wget -q https://dl.google.com/android/repository/android-ndk-r30-linux.zip
          
          echo "📦 Extracting toolchain..."
          unzip -q android-ndk-r30-linux.zip
          echo "NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r30" >> $GITHUB_ENV

      - name: Configure and Apply Defconfig
        run: |
          if [ -f configs/android_ndk_defconfig ]; then
            make android_ndk_defconfig
          elif [ -f configs/defconfig ]; then
            make defconfig
          else
            make allyesconfig
          fi

          # Force standalone static compilation configuration rules
          sed -i 's/CONFIG_STATIC=n/CONFIG_STATIC=y/' .config
          sed -i 's/# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          sed -i 's/CONFIG_PIE=y/CONFIG_PIE=n/' .config
          sed -i 's/CONFIG_BUILD_LIBBUSYBOX=y/CONFIG_BUILD_LIBBUSYBOX=n/' .config
          
          # Force maximum optimizations for modern ARM64 layouts
          echo "CONFIG_EXTRA_CFLAGS=\"-O3 -march=armv8-a -static\"" >> .config

      - name: Assemble Brutal Busybox Binary via NDK Clang (r30 toolchain)
        run: |
          # Map variables straight to the extracted Google r30 toolchain binaries folder
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          export ARCH=arm64
          export CROSS_COMPILE="$TOOLCHAIN/aarch64-linux-android-"
          
          # Force the build to use the NDK Clang wrapper targeting the stable Android API level
          make CC="$TOOLCHAIN/aarch64-linux-android21-clang" -j$(nproc) busybox

      - name: Verify Binary Matrix
        run: |
          if [ ! -f busybox ]; then
            echo "[CRITICAL ERROR]: Busybox binary failed to assemble!"
            exit 1
          fi
          file busybox
          ls -lh busybox

      - name: Upload Static Binary Asset
        uses: actions/upload-artifact@v4
        with:
          name: brutal-busybox-static-arm64
          path: busybox
          if-no-files-found: error
